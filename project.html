    <div class="page">
        <a class="back-btn" href="projects.html">

                <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

        <div class="project-header">

            <div class="project-tags" id="proj-tags"></div>
        </div>

        <div class="divider"></div>

        <div id="proj-dummy" style="background:#1a1a18;  border:1px solid #2a2a28; height:220px; margin-bottom:36px;"></div>

        <div id="proj-content"></div>

        <div class="project-nav">
            <a class="nav-btn" href="projects.html">
                <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                back to projects
            </a>
        </div>
    </div>


    <script>
        const projects = [
            {
                title: 'Remediation in data migration',
                desc: 'Enterprise-ready Atlassian migrations powered by intelligent error handling, boosting reliability by 102%.',
                tags: ['end-to-end', 'atlassian', '2024–25'],
                color: 'linear-gradient(145deg, #5b2d9e, #8b3fcf)'
            },
            {
                title: 'Copilot search',
                desc: 'Making discovery smarter with AI search and scaling Copilot Search across Microsoft products.',
                tags: ['product design', 'microsoft', '2026'],
                color: 'linear-gradient(145deg, #1a3a6b, #2563eb)'
            },
            {
                title: 'Exergame for elderly',
                desc: 'An interactive game inspired by Indian stories and mythology, designed to make physiotherapy more engaging and accessible.',
                tags: ['interaction design', 'exergame', 'university project', '2019'],
                color: 'linear-gradient(145deg, #7c2d12, #ea580c)'
            },
            {
                title: 'NTU museum app',
                desc: 'Reimagining the NTU museum experience into a cohesive and immersive mobile application.',
                tags: ['immersive experience', 'university project', '2018'],
                color: 'linear-gradient(145deg, #134e4a, #0d9488)'
            },
            {
                title: 'Code art',
                desc: 'A collection of small, weird, delightful things built for joy. No brief, no deadline. Just vibes.',
                tags: ['experiments', 'creative coding', 'ongoing'],
                color: 'linear-gradient(145deg, #1a1a18, #2a2a28)'
            },
            {
                title: 'Simplifying data selection',
                desc: 'Intuitive data selection for enterprise scale migrations, enabling confident high-volume data transfer.',
                tags: ['ux enhancement', 'atlassian', '2023'],
                color: 'linear-gradient(145deg, #1a2a3a, #1e4d6b)'
            }
        ];

        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id')) || 0;
        const proj = projects[id];

        // Fill content
        document.title = 'Nebin Biju';
        document.getElementById('proj-title').textContent = proj.title;
        document.getElementById('proj-desc').textContent = proj.desc;
        const dummyEl = document.getElementById('proj-dummy');
        if (id === 0 || id === 3 || id === 4 || id === 5) {
            dummyEl.style.display = 'none';
        } else if (id === 2) {
            dummyEl.style.background = '#1a1a18';
            dummyEl.style.display = 'flex';
            dummyEl.style.flexDirection = 'column';
            dummyEl.style.alignItems = 'center';
            dummyEl.style.justifyContent = 'center';
            dummyEl.style.height = 'auto';
            dummyEl.style.padding = '48px 24px';
            dummyEl.style.gap = '16px';
            dummyEl.innerHTML = '<canvas id="wip-char" width="80" height="100" style="image-rendering:pixelated;display:block;"></canvas>'
                + '<p style="font-size:13px;font-weight:600;color:#555552;line-height:1.85;text-align:center;">A condensed version of this project is a work in progress.<br>For now, do take a look at the detailed version in the link below.</p>'
                + '<a href="https://drive.google.com/file/d/1jfEXqQp83PV8q7BLoIqO-SLCmQTgzgOx/view?usp=drive_link" target="_blank" style="font-family:\'Roboto Mono\',monospace;font-size:13px;font-weight:700;color:#f1629c;text-decoration:none;">Link to detailed report</a>';

            (function() {
                const cc = document.getElementById('wip-char');
                const cx = cc.getContext('2d');
                const P = 4, OX = 3, OY0 = 3;
                const K = {
                    H: '#3d2b1f', S: '#c8956c', Sd: '#b07050', E: '#141413',
                    J: '#f1629c', JL: '#ff8ab8', JD: '#b03060', L: '#555558', Z: '#f1629c',
                };
                let T = 0;
                function draw() {
                    cx.clearRect(0, 0, 80, 100);
                    T++;
                    const ph = T * 0.045;
                    const lay = Math.round(Math.sin(ph * 4) * 1.5);
                    const ray = Math.round(Math.cos(ph * 4) * 1.5);
                    function p(x, y, w, h, c) {
                        cx.fillStyle = c;
                        cx.fillRect((OX + x) * P, (OY0 + y) * P, w * P, h * P);
                    }
                    // shoes
                    p(0, 17, 4, 2, K.Z); p(5, 17, 4, 2, K.Z);
                    // legs
                    p(1, 12, 3, 5, K.L); p(6, 12, 3, 5, K.L);
                    // body
                    p(1, 7, 8, 5, K.J); p(0, 8, 1, 3, K.J); p(9, 8, 1, 3, K.J);
                    p(1, 7, 2, 2, K.JD); p(7, 7, 2, 2, K.JD);
                    p(4, 8, 2, 4, K.JL); p(1, 11, 8, 1, K.JD);
                    // ruler (drawn before arm so hand overlaps handle)
                    const RC = '#e8d070', RCD = '#aa9030';
                    p(-2, 3+lay, 1, 5, RC);
                    p(-2, 4+lay, 1, 1, RCD);
                    p(-2, 6+lay, 1, 1, RCD);
                    // left arm
                    p(-2, 8 + lay, 2, 4, K.J); p(-2, 12 + lay, 2, 1, K.S);
                    // laptop
                    const lpy = OY0 + 11;
                    cx.fillStyle = '#4a4a48'; cx.fillRect((OX+0)*P, (lpy-3)*P, P*10, P*3);
                    cx.fillStyle = '#2a2a28'; cx.fillRect((OX+1)*P, (lpy-3)*P, P*8,  P*2);
                    cx.fillStyle = '#f1629c'; cx.fillRect((OX+2)*P, (lpy-3)*P, P*6,  P);
                    cx.fillStyle = 'rgba(241,98,156,0.3)'; cx.fillRect((OX+2)*P, (lpy-2)*P, P*6, P);
                    cx.fillStyle = '#555552'; cx.fillRect((OX+0)*P, (lpy-1)*P, P*10, P);
                    cx.fillStyle = '#4a4a48'; cx.fillRect((OX-1)*P, lpy*P,     P*12, P*2);
                    cx.fillStyle = '#666662';
                    for (let k = 0; k < 5; k++) cx.fillRect((OX + k*2)*P, (lpy+1)*P, P, P);
                    // right arm
                    p(10, 8 + ray, 2, 4, K.J); p(10, 12 + ray, 2, 1, K.S);
                    // neck + face
                    p(3, 7, 4, 1, K.S);
                    p(2, 1, 6, 5, K.S); p(1, 2, 8, 3, K.S);
                    p(3, 3, 1, 1, K.E); p(6, 3, 1, 1, K.E);
                    p(4, 4, 2, 1, K.Sd);
                    p(3, 5, 1, 1, K.E); p(6, 5, 1, 1, K.E); p(4, 6, 2, 1, K.E);
                    // hair
                    p(1, 0, 8, 1, K.H); p(0, 1, 10, 1, K.H);
                    p(0, 2, 2, 1, K.H); p(8, 2, 2, 1, K.H);
                    p(0, 3, 1, 1, K.H); p(9, 3, 1, 1, K.H);
                    // builder hat (on top of hair)
                    const HC = '#f5c518', HCS = '#c9a010';
                    p(2, -1, 6, 1, HC);
                    p(1,  0, 8, 1, HC);
                    p(-1, 1, 3, 1, HC); p(8, 1, 3, 1, HC);
                    p(3, -1, 1, 1, HCS);
                    requestAnimationFrame(draw);
                }
                draw();
            })();
        } else if (id === 5) {
            dummyEl.style.background = "url('images/Data_selection.png') center/cover no-repeat";
            dummyEl.style.height = '320px';
        } else {
            dummyEl.style.background = proj.color;
        }

        const tagsEl = document.getElementById('proj-tags');
        proj.tags.forEach(t => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsEl.appendChild(span);
        });

        const atlassianImages = [
            ...Array.from({length: 67}, (_, i) => {
                const n = String(i + 1).padStart(2, '0');
                return `<img src="https://github.com/nebinbiju1/nebinbiju1.github.io/releases/download/slides-v1/${n}.png" style="width:100%;display:block;margin-bottom:16px;" alt="slide ${i+1}">`;
            }),
            `<video src="Videos/test_4.mp4" controls style="width:100%;display:block;margin-bottom:16px;"></video>`,
            ...Array.from({length: 90 - 76}, (_, i) => {
                const n = String(i + 77).padStart(2, '0');
                return `<img src="https://github.com/nebinbiju1/nebinbiju1.github.io/releases/download/slides-v1/${n}.png" style="width:100%;display:block;margin-bottom:16px;" alt="slide ${i+77}">`;
            }),
        ].join('');

        const dataSelectionImages = `
            <div class="content-block"><h2>Here's what I did</h2></div>
            <video src="Videos/selection.mp4" controls style="width:100%;display:block;margin-bottom:36px;"></video>
            <div class="content-block"><h2>Here's how I did</h2></div>
            ` + Array.from({length: 50}, (_, i) => {
            const n = String(i + 1).padStart(2, '0');
            return `<img src="https://github.com/nebinbiju1/nebinbiju1.github.io/releases/download/data-selection-v1/${n}.png" style="width:100%;display:block;margin-bottom:16px;" alt="slide ${i+1}">`;
        }).join('');

        const defaultContent = ``;

        const projectContent = {
            0: atlassianImages,
            5: dataSelectionImages,
            3: `<img src="https://framerusercontent.com/images/EVq4ZctUdzbCsdfcdAUWFC4QsY.jpg?width=2480&height=40020" style="width:100%;display:block;" alt="NTU museum app">`,
            4: `
                <div class="video-list" id="video-list">
                    <div class="video-item">
                        <div class="video-item-meta">
                            <div class="video-item-title">Dino finder</div>
                            <div class="video-item-desc">Explore a Minecraft-inspired voxel world, track hidden dinosaurs with a compass, and discover fun facts about them along the way.</div>
                            <a href="https://nebinbiju1.github.io/dino-finder/" class="video-item-link" target="_blank" rel="noopener">try the experience</a>
                        </div>
                        <div class="video-thumb" data-videoid="momVSo-qWCY">
                            <img src="https://img.youtube.com/vi/momVSo-qWCY/maxresdefault.jpg" onerror="this.src='https://img.youtube.com/vi/momVSo-qWCY/hqdefault.jpg'" style="width:100%;aspect-ratio:16/9;display:block;object-fit:cover;">
                            <div class="video-play-btn"><div class="video-play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
                        </div>
                    </div>
                    <div class="video-item">
                        <div class="video-item-meta">
                            <div class="video-item-title">The marauder's chart</div>
                            <div class="video-item-desc">An interactive data visualisation of character mentions across all seven Harry Potter books.</div>
                            <a href="https://nebinbiju1.github.io/the-marauders-chart/" class="video-item-link" target="_blank" rel="noopener">try the experience</a>
                        </div>
                        <div class="video-thumb" data-videoid="O5EcYNBfFp4">
                            <img src="https://img.youtube.com/vi/O5EcYNBfFp4/maxresdefault.jpg" onerror="this.src='https://img.youtube.com/vi/O5EcYNBfFp4/hqdefault.jpg'" style="width:100%;aspect-ratio:16/9;display:block;object-fit:cover;">
                            <div class="video-play-btn"><div class="video-play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
                        </div>
                    </div>
                    <div class="video-item">
                        <div class="video-item-meta">
                            <div class="video-item-title">Fruit ninja 3d</div>
                            <div class="video-item-desc">Slice fruits with your bare hands. No controller, just your webcam and reflexes.</div>
                            <a href="https://nebinbiju1.github.io/fruitninja3d/" class="video-item-link" target="_blank" rel="noopener">try the experience</a>
                        </div>
                        <div class="video-thumb" data-videoid="9RtaUmyEG70">
                            <img src="https://img.youtube.com/vi/9RtaUmyEG70/maxresdefault.jpg" onerror="this.src='https://img.youtube.com/vi/9RtaUmyEG70/hqdefault.jpg'" style="width:100%;aspect-ratio:16/9;display:block;object-fit:cover;">
                            <div class="video-play-btn"><div class="video-play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
                        </div>
                    </div>
                    <div class="video-item">
                        <div class="video-item-meta">
                            <div class="video-item-title">Waveart</div>
                            <div class="video-item-desc">A polar function visualizer that generates beautiful mathematical curves around the unit circle.</div>
                            <a href="https://nebinbiju1.github.io/waveart/" class="video-item-link" target="_blank" rel="noopener">try the experience</a>
                        </div>
                        <div class="video-thumb" data-videoid="eDSZ0qcvW_s">
                            <img src="https://img.youtube.com/vi/eDSZ0qcvW_s/maxresdefault.jpg" onerror="this.src='https://img.youtube.com/vi/eDSZ0qcvW_s/hqdefault.jpg'" style="width:100%;aspect-ratio:16/9;display:block;object-fit:cover;">
                            <div class="video-play-btn"><div class="video-play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
                        </div>
                    </div>
                    <div class="video-item">
                        <div class="video-item-meta">
                            <div class="video-item-title">Vangogh</div>
                            <div class="video-item-desc">A browser-based finger painting app that uses your webcam to track hand movements in real time.</div>
                            <a href="https://nebinbiju1.github.io/vangogh/" class="video-item-link" target="_blank" rel="noopener">try the experience</a>
                        </div>
                        <div class="video-thumb" data-videoid="EvUgRl6xLEU">
                            <img src="https://img.youtube.com/vi/EvUgRl6xLEU/maxresdefault.jpg" onerror="this.src='https://img.youtube.com/vi/EvUgRl6xLEU/hqdefault.jpg'" style="width:100%;aspect-ratio:16/9;display:block;object-fit:cover;">
                            <div class="video-play-btn"><div class="video-play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
                        </div>
                    </div>
                    <div class="video-item">
                        <div class="video-item-meta">
                            <div class="video-item-title">Homepage animation for this website</div>
                        </div>
                        <div class="video-thumb" data-videoid="vmQly579PvQ">
                            <img src="https://img.youtube.com/vi/vmQly579PvQ/maxresdefault.jpg" onerror="this.src='https://img.youtube.com/vi/vmQly579PvQ/hqdefault.jpg'" style="width:100%;aspect-ratio:16/9;display:block;object-fit:cover;">
                            <div class="video-play-btn"><div class="video-play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
                        </div>
                    </div>
                </div>
            `,
            2: ``
        };

        document.getElementById('proj-content').innerHTML = projectContent[id] || defaultContent;

        // Click-to-load YouTube facade for project 4
        if (id === 4) {
            let activeThumb = null;
            let activeVid = null;

            function restoreThumb(thumb, vid) {
                thumb.innerHTML = `<img src="https://img.youtube.com/vi/${vid}/maxresdefault.jpg" onerror="this.src='https://img.youtube.com/vi/${vid}/hqdefault.jpg'" style="width:100%;aspect-ratio:16/9;display:block;object-fit:cover;"><div class="video-play-btn"><div class="video-play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>`;
                thumb.dataset.videoid = vid;
            }

            document.getElementById('video-list').addEventListener('click', e => {
                const thumb = e.target.closest('.video-thumb');
                if (!thumb) return;
                const vid = thumb.dataset.videoid;
                if (!vid) return;
                if (activeThumb && activeThumb !== thumb) restoreThumb(activeThumb, activeVid);
                thumb.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${vid}?rel=0&modestbranding=1&iv_load_policy=3&autoplay=1" style="width:100%;aspect-ratio:16/9;display:block;border:none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                delete thumb.dataset.videoid;
                activeThumb = thumb;
                activeVid = vid;
            });
        }

    </script>
</body>
</html>
